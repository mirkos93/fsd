// The Android Gradle Plugin builds the native code with the Android NDK.

group = "io.github.mirkos93.fsd"
version = "1.0"

buildscript {
    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        // The Android Gradle Plugin knows how to build native code with the NDK.
        classpath("com.android.tools.build:gradle:8.11.1")
    }
}

rootProject.allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

apply plugin: "com.android.library"

android {
    namespace = "io.github.mirkos93.fsd"

    // Bumping the plugin compileSdk version requires all clients of this plugin
    // to bump the version in their app.
    compileSdk = 36

    // Use the NDK version
    // declared in /android/app/build.gradle file of the Flutter project.
    // Replace it with a version number if this plugin requires a specific NDK version.
    // (e.g. ndkVersion "23.1.7779620")
    ndkVersion = android.ndkVersion

    // Invoke the shared CMake build with the Android Gradle Plugin.
    externalNativeBuild {
        cmake {
            path = "../src/CMakeLists.txt"
            // stable-diffusion.cpp + ggml require >= 3.12; we ask for 3.22.1
            // which ships with the AGP-bundled CMake distribution.
            version = "3.22.1"
        }
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    // Vulkan offload is opt-in. Set `fsdVulkan=true` in the consuming app's
    // gradle.properties (or pass `-PfsdVulkan=true` on the CLI) to compile the
    // ggml-vulkan backend into libfsd.so. Default OFF: the production arm64
    // CPU pipeline is the supported, regression-tested path. ON adds ~XX MB
    // of SPIR-V shaders to the .so and requires `glslc` (Vulkan SDK) on the
    // host PATH for the cross-compile of vulkan-shaders-gen.
    //
    // See src/CMakeLists.txt for what SD_VULKAN actually toggles, and
    // fsd.cpp / fsd_gpu_available() for the runtime probe + CPU fallback.
    def fsdVulkanProp = (project.findProperty("fsdVulkan") ?: "false").toString()
    def fsdVulkanOn   = fsdVulkanProp.equalsIgnoreCase("true") || fsdVulkanProp == "1"

    defaultConfig {
        minSdk = 24
        // arm64-v8a is the only target we claim. armeabi-v7a builds, but
        // inference perf is unusable on 32-bit ARM with this model size, and
        // an SD 1.5 checkpoint blows past the 32-bit address space at INT8.
        // Revisit if the hardware floor moves.
        ndk {
            abiFilters "arm64-v8a"
        }
        externalNativeBuild {
            cmake {
                def args = [
                    "-DANDROID_STL=c++_shared",
                    "-DANDROID_ARM_NEON=TRUE",
                    "-DSD_VULKAN=" + (fsdVulkanOn ? "ON" : "OFF"),
                ]
                if (fsdVulkanOn) {
                    // libvulkan.so on the NDK exposes vkGetPhysicalDeviceFeatures2
                    // (core Vulkan 1.1) only from API 28 onward, and ggml-vulkan
                    // links against it directly. Bump the *NDK* platform when
                    // Vulkan is ON; the Java side keeps minSdk=24 (the .so just
                    // won't load on api<28 in that scenario, fsd_gpu_available
                    // reports 0, and the engine falls back to CPU).
                    args << "-DANDROID_PLATFORM=android-28"
                }
                arguments args as String[]
            }
        }
    }
}
